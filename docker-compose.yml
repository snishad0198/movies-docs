version: '3.8'

services:
  # 1. MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: movies_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: movies_snishad
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend API & Admin Console Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movies_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/movies_snishad"
      JWT_SECRET: "movies-snishad-super-secret-jwt-key-min-32-chars-2026"
      INTERNAL_API_KEY: "movies-snishad-secure-internal-token-2026"
      ALLOWED_FRONTEND_ORIGINS: "http://localhost:3000,http://localhost:3001,http://frontend:3001"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      TMDB_API_KEY: "your_tmdb_api_key_here"
      DOWNLOAD_API_URL: "https://02moviedownloader.top/"
      ADMIN_EMAIL: "admin@moviessnishad.com"
      ADMIN_PASSWORD: "Admin@123456"
      PORT: 3000
    ports:
      - "3000:3000"

  # 3. Frontend Cinema Client Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movies_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_SITE_NAME: "Movies.snishad"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3001"
      NEXT_PUBLIC_BACKEND_URL: "http://backend:3000"
      BACKEND_INTERNAL_URL: "http://backend:3000"
      INTERNAL_API_KEY: "movies-snishad-secure-internal-token-2026"
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  mysql_data:
